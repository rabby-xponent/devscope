<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="flameGrad" x1="12" y1="56" x2="52" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="85%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .icon-bg { fill: #0c0b0e; }
      .icon-border { stroke: #26242c; }
      @media (prefers-color-scheme: light) {
        .icon-border { stroke: rgba(0, 0, 0, 0.2); }
      }
      @media (prefers-color-scheme: dark) {
        .icon-border { stroke: rgba(240, 160, 75, 0.4); }
      }
    </style>
  </defs>

  <!-- Dark Background Squircle -->
  <rect width="64" height="64" rx="16" class="icon-bg" />
  <rect width="62" height="62" x="1" y="1" rx="15" class="icon-border" stroke-width="1.5" />

  <!-- Outer Flame Silhouette -->
  <path
    d="M32 9C32 9 37 18 34 24C39 20 44 23 46 28C48.5 34 46.5 41 42 46C37 51 27 51 22 46C17.5 41 15.5 34 18 28C20 23 25 20 30 24C27 18 32 9 32 9Z"
    fill="url(#flameGrad)"
    opacity="0.18"
    filter="url(#glow)"
  />

  <path
    d="M32 11C32 11 36.5 19 33.5 24.5C38.5 21 43 23.5 44.5 28.5C47 34 45 40.5 41 45C36.5 49.5 27.5 49.5 23 45C19 40.5 17 34 19.5 28.5C21 23.5 25.5 21 30.5 24.5C27.5 19 32 11 32 11Z"
    stroke="url(#flameGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Git Commit & Branching Core -->
  <!-- Main Trunk Line -->
  <line x1="32" y1="23" x2="32" y2="44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- Branch Line -->
  <path d="M32 37L39 30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Branch Node Top -->
  <circle cx="39" cy="30" r="3.5" fill="#f97316" stroke="#ffffff" stroke-width="2" />
  <!-- Main Trunk Nodes -->
  <circle cx="32" cy="23" r="3.5" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
  <circle cx="32" cy="44" r="4.5" fill="#c2410c" stroke="#ffffff" stroke-width="2.5" />
</svg>
