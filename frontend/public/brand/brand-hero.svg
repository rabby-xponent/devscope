<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#080b12"/>
      <stop offset="100%" stop-color="#03060a"/>
    </linearGradient>

    <!-- Orange Radial Ambient Glows -->
    <radialGradient id="glowLeft" cx="260" cy="315" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTopRight" cx="1000" cy="100" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar Sweep Glow -->
    <radialGradient id="heroRadarSweep" cx="16" cy="16" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="heroGitOrange" x1="16" y1="24" x2="23" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>

    <style>
      .font-heavy { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#heroBg)"/>
  <rect width="1200" height="630" fill="url(#techGrid)"/>

  <!-- Radial Glows -->
  <circle cx="260" cy="315" r="400" fill="url(#glowLeft)"/>
  <circle cx="1000" cy="100" r="450" fill="url(#glowTopRight)"/>

  <!-- Outer Card Bezel / Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- LEFT: Hero Radar Emblem (Scaled up to 360x360 centered around x=260, y=315) -->
  <g transform="translate(80, 135) scale(11.25)">
    <!-- Rings -->
    <circle cx="16" cy="16" r="13.5" stroke="#475569" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="16" cy="16" r="8.5" stroke="#475569" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.7"/>
    <circle cx="16" cy="16" r="3.5" stroke="#475569" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Reticle Axes -->
    <line x1="16" y1="2.5" x2="16" y2="29.5" stroke="#475569" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="2.5" y1="16" x2="29.5" y2="16" stroke="#475569" stroke-width="1.2" stroke-opacity="0.6"/>

    <!-- Radar Sweep -->
    <path d="M16 16 L16 2.5 A13.5 13.5 0 0 1 29.5 16 Z" fill="url(#heroRadarSweep)"/>
    <line x1="16" y1="16" x2="25.5" y2="6.5" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Git Trunk & Branch -->
    <line x1="16" y1="9.5" x2="16" y2="23.5" stroke="url(#heroGitOrange)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M16 17.5 C16 15 19 13.5 22.5 11" stroke="url(#heroGitOrange)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Commit Nodes -->
    <circle cx="16" cy="23.5" r="2.2" fill="#c2410c" stroke="#080b12" stroke-width="1"/>
    <circle cx="16" cy="23.5" r="0.9" fill="#ffffff"/>
    <circle cx="16" cy="16" r="1.8" fill="#ea580c"/>
    <circle cx="16" cy="9.5" r="2.2" fill="#ea580c" stroke="#080b12" stroke-width="1"/>
    <circle cx="16" cy="9.5" r="0.9" fill="#ffffff"/>
    <circle cx="22.5" cy="11" r="2.6" fill="#f59e0b" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="22.5" cy="11" r="1" fill="#ffffff"/>
  </g>

  <!-- RIGHT: Typography & Feature Highlights -->
  <!-- Category Badge -->
  <g transform="translate(520, 120)">
    <rect width="290" height="32" rx="16" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4.5" fill="#f97316"/>
    <text x="30" y="21" class="font-sans" fill="#fb923c" font-size="12" font-weight="700" letter-spacing="0.12em">AI TALENT INTELLIGENCE</text>
  </g>

  <!-- Main Headline "GitGrill" -->
  <text x="520" y="240" class="font-heavy" font-size="88" letter-spacing="-0.02em">
    <tspan fill="#f8fafc">Git</tspan><tspan fill="#ea580c" dx="6">Grill</tspan>
  </text>

  <!-- Subheading -->
  <text x="520" y="295" class="font-sans" fill="#cbd5e1" font-size="24" font-weight="500">
    AI-Native Technical Talent Intelligence &amp; Developer CareerOS
  </text>
  <text x="520" y="332" class="font-sans" fill="#94a3b8" font-size="17" font-weight="400">
    Transforming GitHub repositories &amp; resumes into verified engineering audits.
  </text>

  <!-- Value Pillar Badges -->
  <g transform="translate(520, 390)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="190" height="42" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="18" y="26" class="font-sans" fill="#f1f5f9" font-size="13.5" font-weight="600">⚡ ReAct Code Auditor</text>

    <!-- Pill 2 -->
    <rect x="206" y="0" width="204" height="42" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="224" y="26" class="font-sans" fill="#f1f5f9" font-size="13.5" font-weight="600">🎯 Claim vs. Evidence</text>

    <!-- Pill 3 -->
    <rect x="426" y="0" width="180" height="42" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="444" y="26" class="font-sans" fill="#f1f5f9" font-size="13.5" font-weight="600">📁 Resume Vault AST</text>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(520, 500)">
    <text x="0" y="0" class="font-sans" fill="#64748b" font-size="14" font-weight="500">
      Production Live at <tspan fill="#ea580c" font-weight="600">gitgrill-gr.vercel.app</tspan> • Open Source MIT
    </text>
  </g>
</svg>
