<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="markRadarSweep" cx="16" cy="16" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="markGitOrange" x1="16" y1="24" x2="23" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .reticle-ring { stroke: #94a3b8; }
      @media (prefers-color-scheme: dark) {
        .reticle-ring { stroke: #64748b; }
      }
    </style>
  </defs>

  <!-- Outer Radar Reticle Ring -->
  <circle cx="16" cy="16" r="13.5" class="reticle-ring" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Middle Ring -->
  <circle cx="16" cy="16" r="8.5" class="reticle-ring" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.5"/>
  <!-- Inner Ring -->
  <circle cx="16" cy="16" r="3.5" class="reticle-ring" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Reticle Axes -->
  <line x1="16" y1="2.5" x2="16" y2="29.5" class="reticle-ring" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="2.5" y1="16" x2="29.5" y2="16" class="reticle-ring" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Radar Scan Sweep -->
  <path d="M16 16 L16 2.5 A13.5 13.5 0 0 1 29.5 16 Z" fill="url(#markRadarSweep)"/>
  <line x1="16" y1="16" x2="25.5" y2="6.5" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Git Commit Branch Network -->
  <line x1="16" y1="9.5" x2="16" y2="23.5" stroke="url(#markGitOrange)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M16 17.5 C16 15 19 13.5 22.5 11" stroke="url(#markGitOrange)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="16" cy="23.5" r="2.2" fill="#c2410c" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="16" cy="16" r="1.8" fill="#ea580c"/>
  <circle cx="16" cy="9.5" r="2.2" fill="#ea580c" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="22.5" cy="11" r="2.6" fill="#f59e0b" stroke="#ea580c" stroke-width="1.5"/>
</svg>
