<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="iconBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Subtle Orange Atmospheric Glow Behind Radar -->
    <radialGradient id="iconAtmosphere" cx="256" cy="256" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar Sweep Glow -->
    <radialGradient id="iconRadarSweep" cx="256" cy="256" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.05"/>
    </radialGradient>

    <!-- Git Pipeline Gradient -->
    <linearGradient id="iconGitOrange" x1="256" y1="360" x2="350" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="55%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle Border Stroke -->
    <linearGradient id="iconBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#iconBg)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" stroke="url(#iconBorder)" stroke-width="4"/>

  <!-- Radial Core Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#iconAtmosphere)"/>

  <!-- Radar Reticle Rings (Scaled from 32x32 to 512x512, scale=12.5, centered at 256, 256) -->
  <!-- Outer Ring (r = 13.5 * 12.5 = 168.75) -->
  <circle cx="256" cy="256" r="168" stroke="#475569" stroke-width="8" stroke-opacity="0.7"/>
  <!-- Middle Dashed Ring (r = 8.5 * 12.5 = 106.25) -->
  <circle cx="256" cy="256" r="106" stroke="#475569" stroke-width="6" stroke-dasharray="12 12" stroke-opacity="0.6"/>
  <!-- Inner Ring (r = 3.5 * 12.5 = 43.75) -->
  <circle cx="256" cy="256" r="44" stroke="#475569" stroke-width="5" stroke-opacity="0.5"/>

  <!-- Reticle Axes -->
  <line x1="256" y1="88" x2="256" y2="424" stroke="#475569" stroke-width="5" stroke-opacity="0.5"/>
  <line x1="88" y1="256" x2="424" y2="256" stroke="#475569" stroke-width="5" stroke-opacity="0.5"/>

  <!-- Radar Scan Sweep (Top Right Quadrant) -->
  <path d="M256 256 L256 88 A168 168 0 0 1 424 256 Z" fill="url(#iconRadarSweep)"/>
  <line x1="256" y1="256" x2="375" y2="137" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>

  <!-- Git Trunk Line -->
  <line x1="256" y1="175" x2="256" y2="350" stroke="url(#iconGitOrange)" stroke-width="15" stroke-linecap="round"/>

  <!-- Git Branch Curve -->
  <path d="M256 275 C256 244 294 225 338 194" stroke="url(#iconGitOrange)" stroke-width="15" stroke-linecap="round"/>

  <!-- Commit Nodes -->
  <!-- Bottom Node -->
  <circle cx="256" cy="350" r="26" fill="#c2410c" stroke="#090d16" stroke-width="8"/>
  <circle cx="256" cy="350" r="12" fill="#ffffff"/>

  <!-- Center Reticle Node -->
  <circle cx="256" cy="256" r="18" fill="#ea580c"/>

  <!-- Top Node -->
  <circle cx="256" cy="175" r="26" fill="#ea580c" stroke="#090d16" stroke-width="8"/>
  <circle cx="256" cy="175" r="12" fill="#ffffff"/>

  <!-- Branch Scanned Target Node -->
  <circle cx="338" cy="194" r="30" fill="#f59e0b" stroke="#ea580c" stroke-width="10"/>
  <circle cx="338" cy="194" r="12" fill="#ffffff"/>
</svg>
