<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="logoFlameGrad" x1="4" y1="42" x2="34" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="80%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="logoCoreGrad" x1="12" y1="38" x2="28" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <style>
      .logo-txt { fill: #0f172a; font-family: 'Sora', system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
      .logo-ember { fill: url(#logoFlameGrad); }
      @media (prefers-color-scheme: dark) {
        .logo-txt { fill: #ece9f0; }
      }
    </style>
  </defs>

  <!-- Free-standing Flame Mark -->
  <g transform="translate(2, 4) scale(1.2)">
    <path
      d="M16 2.5C16 2.5 20.8 7.8 19.8 12.2C22.2 10.6 24.8 12.6 25.8 16C27.2 21 23.6 27.8 16 28.5C8.4 27.8 4.8 21 6.2 16C7.2 12.6 9.8 10.6 12.2 12.2C11.2 7.8 16 2.5 16 2.5Z"
      fill="url(#logoFlameGrad)"
    />
    <path
      d="M16 11.5C16 11.5 18.6 14.8 18.2 17.2C19.6 16.2 21.2 17.4 21.8 19.4C22.6 22.8 20.2 26.6 16 27C11.8 26.6 9.4 22.8 10.2 19.4C10.8 17.4 12.4 16.2 13.8 17.2C13.4 14.8 16 11.5 16 11.5Z"
      fill="url(#logoCoreGrad)"
      opacity="0.9"
    />
    <line x1="13.5" y1="14.5" x2="13.5" y2="24" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M13.5 19.8L18.5 15.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="18.5" cy="15.5" r="2.2" fill="#ffffff"/>
    <circle cx="13.5" cy="14.5" r="2.2" fill="#ffffff"/>
    <circle cx="13.5" cy="24" r="2.6" fill="#ffffff"/>
  </g>

  <!-- Typography "GitGrill" -->
  <text x="50" y="32" class="logo-txt">
    Git<tspan fill="#ea580c">Grill</tspan>
  </text>
</svg>
